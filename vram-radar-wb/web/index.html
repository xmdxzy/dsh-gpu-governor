<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU Radar · Who's eating the GPU — and which model or task owns it</title>
<meta name="description" content="Break a machine's GPU usage down to project → task → weights: three dials for the totals, a leaderboard for who's on top, and a drill-down for which model it is running.">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="backdrop" aria-hidden="true">
  <span class="aurora a1"></span>
  <span class="aurora a2"></span>
  <span class="aurora a3"></span>
  <span class="grid"></span>
  <span class="pointerlight" id="pointerlight"></span>
  <span class="veil"></span>
</div>

<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="15" fill="none" stroke="currentColor" stroke-opacity=".22"/>
      <circle cx="20" cy="20" r="9" fill="none" stroke="currentColor" stroke-opacity=".32"/>
      <circle cx="20" cy="20" r="3" fill="currentColor"/>
      <path d="M20 20 L20 5" stroke="currentColor" stroke-width="1.4"/>
    </svg>
    <div class="brandtext">
      <h1 data-i18n-html="brand.title">GPU RADAR</h1>
      <p data-i18n="brand.tagline">Who's on the GPU · which model and which task that usage belongs to</p>
    </div>
  </div>
  <div class="topbar-side">
    <div class="lang" id="lang">
      <button class="langbtn" id="langbtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="langmenu" aria-label="Language" title="Language">
        <svg class="globe" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="6.1" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <path d="M1.9 8h12.2M8 1.9c1.7 1.8 2.6 3.9 2.6 6.1S9.7 12.3 8 14.1C6.3 12.3 5.4 10.2 5.4 8S6.3 3.7 8 1.9Z" fill="none" stroke="currentColor" stroke-width="1.1"/>
        </svg>
        <span id="langnow">EN</span>
        <svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.6 L5 6.6 L8 3.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <ul class="langmenu" id="langmenu" role="listbox" aria-label="Language" hidden>
        <li><button type="button" role="option" data-lang="en" aria-selected="true">English<i>EN</i></button></li>
        <li><button type="button" role="option" data-lang="zh" aria-selected="false">中文<i>ZH</i></button></li>
      </ul>
    </div>
    <div class="topmeta" id="topmeta"></div>
  </div>
</header>

<main>
  <section class="hero" id="hero" data-i18n-aria-label="hero.aria"></section>

  <section class="board" data-i18n-aria-label="board.aria">
    <div class="board-head">
      <h2><span data-i18n="board.title">Who's on the GPU</span> <span class="hint" id="boardcount"></span></h2>
      <div class="tools">
        <label class="field" id="field" data-has-value="false">
          <span class="field-badge" aria-hidden="true">
            <svg viewBox="0 0 16 16"><circle cx="6.8" cy="6.8" r="4.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.2 10.2 L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
          <input id="search" type="search" placeholder="Search project / task / process / path" autocomplete="off" spellcheck="false" data-i18n-placeholder="search.placeholder" data-i18n-aria-label="search.aria" aria-label="Search projects, tasks and processes">
          <span class="field-count" id="fieldcount" hidden></span>
          <button class="field-clear" id="fieldclear" type="button" data-i18n-aria-label="search.clear" aria-label="Clear search" tabindex="-1">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2.4 2.4 L7.6 7.6 M7.6 2.4 L2.4 7.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
          <kbd class="field-kbd" id="fieldkbd" aria-hidden="true">Ctrl K</kbd>
          <span class="field-glow" aria-hidden="true"></span>
          <span class="field-scan" aria-hidden="true"></span>
        </label>
        <div class="tabs" id="sorttabs" role="tablist">
          <button role="tab" data-sort="mem" aria-selected="true" data-i18n="sort.mem">VRAM</button>
          <button role="tab" data-sort="cpu" aria-selected="false" data-i18n="sort.cpu">CPU</button>
          <button role="tab" data-sort="share" aria-selected="false" data-i18n="sort.share">Share</button>
        </div>
      </div>
    </div>
    <div class="rows" id="rows"></div>
    <div class="board-foot" id="boardfoot"></div>
  </section>

  <section class="lower">
    <div class="card" id="trend"></div>
    <div class="card" id="workload"></div>
  </section>

  <section class="howto" id="howto"></section>
</main>

<footer class="foot">
  <span data-i18n-html="footer.source">Data from local <code>nvidia-smi</code> and <code>Win32_PerfFormattedData_GPUPerformanceCounters</code></span>
  <span class="dot">·</span>
  <span data-i18n="footer.privacy">Paths and account names redacted</span>
  <span class="dot">·</span>
  <span id="footsrc"></span>
</footer>

<div class="tip" id="tip" hidden></div>
<script src="data/snapshot.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
